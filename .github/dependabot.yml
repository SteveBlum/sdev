version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      exclude:
        - "opensuse/tumbleweed"
    groups:
      docker-minor-dependencies:
        update-types:
        - "minor"
        - "patch"
      docker-major-dependencies:
        update-types:
        - "major"
