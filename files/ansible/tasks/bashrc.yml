---
- name: write bashrc env
  blockinfile:
    path: "{{ home_dir }}/.bashrc.env"
    create: true
    mode: "0755"
    marker: "# {mark} ansible managed PATH"
    block: |
      [[ -n "${BASHRC_ENV_SOURCED:-}" ]] && return
      export BASHRC_ENV_SOURCED=1
      SECRETS_FILE="{{ home_dir }}/.local/secrets.sh.gpg"
      export PATH="{{ home_dir }}/.config/scripts:{{ home_dir }}/.npm/bin:/{{ home_dir }}/.local/bin:$PATH"
      eval "$(fnm env --use-on-cd)"
      [ -f "$SECRETS_FILE" ] && source <(decrypt "$SECRETS_FILE") || true
