---
- name: Install Node.js version and set it as default
  vars:
    node_version: "24"
  shell: |
    eval "$(fnm env)"
    fnm install {{ node_version }}
    fnm default {{ node_version }}
  args:
    executable: /bin/bash

- name: set npm prefix
  command: npm config set prefix {{ ansible_facts['env']['HOME'] }}/.npm
