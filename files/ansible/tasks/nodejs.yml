---
- name: Install Node.js version and set it as default
  vars:
    node_version: "24"
  shell: |
    eval "$(fnm env)"
    fnm install {{ node_version }}
    fnm default {{ node_version }}
  args:
    executable: /bin/bash

- name: allow install scripts for packages that fetch native binaries
  command: npm config set allow-scripts=@opencode/cli,bun,pnpm,tree-sitter-cli --location=global
