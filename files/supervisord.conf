[supervisord]
nodaemon=false
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:opencode]
directory=/root/workspace
command=/root/.cargo/bin/bws run -- /root/.npm/bin/opencode service start
autostart=true
autorestart=unexpected
startsecs=0
exitcodes=0
stdout_logfile=/var/log/opencode.out
stderr_logfile=/var/log/opencode.err
user=root
environment=HOME="/root",USER="root"
